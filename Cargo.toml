[package]
name = "snapaste"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
arboard = "3.4"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tray-icon = "0.19"
muda = "0.15"
image = "0.25"
fs2 = "0.4.3"
directories = "6.0.0"
global-hotkey = "0.6"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
